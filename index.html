<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modo Adulto - Apoio à Autonomia</title>
    <style>
        /* CSS: Temática Azul e Branco e Responsividade */
        :root {
            --primary-blue: #0056b3;
            --light-blue: #e6f0fa;
            --white: #ffffff;
            --dark-text: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-blue); color: var(--dark-text); }
        
        header { background-color: var(--primary-blue); color: var(--white); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        header h1 { font-size: 1.8rem; }
        nav a { color: var(--white); text-decoration: none; margin-left: 15px; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        
        .search-container { margin: 2rem auto; text-align: center; width: 90%; max-width: 600px; }
        .search-container input { width: 75%; padding: 10px; border: 1px solid var(--primary-blue); border-radius: 4px 0 0 4px; }
        .search-container button { width: 20%; padding: 10px; background-color: var(--primary-blue); color: var(--white); border: none; cursor: pointer; border-radius: 0 4px 4px 0; }
        
        .content-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; padding: 2rem; }
        .card { background-color: var(--white); border: 1px solid #cce0ff; border-radius: 8px; padding: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .card h3 { color: var(--primary-blue); margin-bottom: 10px; }
        .card .badge { background-color: var(--light-blue); color: var(--primary-blue); padding: 3px 8px; font-size: 0.8rem; border-radius: 12px; }
        
        /* Contato Section */
        .contatos { background-color: var(--white); padding: 2rem; text-align: center; margin-top: 2rem; border-top: 4px solid var(--primary-blue); }
    </style>
</head>
<body>

    <header>
        <h1>Modo Adulto</h1>
        <nav>
            <a href="#acervo">Acervo</a>
            <a href="#contatos">Contatos</a>
            <a href="login.php">Login Curador</a>
        </nav>
    </header>

    <div class="search-container">
        <!-- Requisito Funcional: Filtrar acervo por nichos ou temas usando barra de pesquisa -->
        <input type="text" id="searchInput" placeholder="Pesquise por nicho, tema ou título...">
        <button onclick="buscarAcervo()">Buscar</button>
    </div>

    <main>
        <div id="acervo" class="content-grid">
            <!-- Os cards de conteúdo (Vídeo, Artigo, Podcast, Flashcard) serão carregados aqui via JS/PHP -->
        </div>
    </main>

    <section id="contatos" class="contatos">
        <h2>Contatos dos Curadores</h2>
        <p>Envie dúvidas ou sugestões de novos conteúdos:</p>
        <p>Email: <strong>suporte@modoadulto.com.br</strong></p>
    </section>

    <script>
        // JS para consumir a API do PHP e renderizar o acervo (UC07 - Consultar Acervo)
        async function buscarAcervo() {
            const query = document.getElementById('searchInput').value;
            const container = document.getElementById('acervo');
            
            try {
                // Rota fictícia para o backend PHP
                const response = await fetch(`buscar_acervo.php?q=${encodeURIComponent(query)}`);
                const dados = await response.json();
                
                container.innerHTML = '';
                if(dados.length === 0) {
                    container.innerHTML = '<p>Nenhum conteúdo disponível para este critério.</p>';
                    return;
                }

                dados.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <span class="badge">${item.tipo_midia.toUpperCase()}</span>
                        <span class="badge">${item.nicho_nome}</span>
                        <h3>${item.titulo}</h3>
                        <p>${item.descricao}</p>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                container.innerHTML = '<p>Erro ao carregar o acervo. Tente novamente.</p>';
            }
        }

        // Carrega tudo ao iniciar
        window.onload = buscarAcervo;
    </script>
</body>
</html>
